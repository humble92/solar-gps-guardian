name: Deploy Modal

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/modal-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install --upgrade pip modal

      - name: Deploy
        run: modal deploy backend/app.py
